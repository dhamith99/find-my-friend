      size: 6754
    params:
      params.yaml:
        data:
          raw_dir: raw
          out_dir: data
          img_size: 224
          val_frac: 0.15
          test_frac: 0.15
          group_split_classes:
          - unknown
          group_split:
            train: 3
            val: 1
            test: 1
        face:
          model_path: assets/face_detection_yunet_2023mar.onnx
          score_threshold: 0.5
          margin: 0.2
          max_side: 1280
    outs:
    - path: data
