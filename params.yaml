seed: 42

data:
  raw_dir: raw
  out_dir: data
  img_size: 224
  val_frac: 0.15          # friend classes: block split by burst order
  test_frac: 0.15
  group_split_classes: [unknown]
  group_split:            # unknown: split by person (5 people)
    train: 3
    val: 1
    test: 1

face:
  model_path: assets/face_detection_yunet_2023mar.onnx
  score_threshold: 0.5    # lowered from 0.6 (uchitha lost too many photos)
  margin: 0.2             # extra space around the face on each side
  max_side: 1280          # photos are shrunk to this before detection (speed)

mlflow:
  tracking_uri: http://127.0.0.1:5000   # start with: bash scripts/start_mlflow.sh
  experiment: find-my-friend

train:
  epochs: 30
  batch_size: 32
  patience: 8            # stop early if val macro-F1 doesn't improve for 8 epochs
  num_workers: 2
  models:                # starting values - Optuna (Phase 3) will tune these
    custom_cnn:
      lr: 0.001
      weight_decay: 0.0001
      dropout: 0.3
      freeze: none
      pretrained: false  # trained from scratch
    mobilenet_v3_small:
      lr: 0.0003
      weight_decay: 0.0001
      dropout: 0.2
      freeze: none
      pretrained: true   # ImageNet weights
    resnet18:
      lr: 0.0003
      weight_decay: 0.0001
      dropout: 0.2
      freeze: none
      pretrained: true

tune:
  n_trials: 20           # same budget for every model (fair comparison)
  epochs: 25
  patience: 6
  pruner_warmup_epochs: 5   # never prune a trial before epoch 5
  search_space:
    lr:                  # searched on a log scale
      custom_cnn: [0.0001, 0.01]
      mobilenet_v3_small: [0.00001, 0.003]
      resnet18: [0.00001, 0.003]
    weight_decay: [0.000001, 0.01]
    dropout: [0.0, 0.5]
    batch_size: [16, 32]
    freeze: [none, head]   # pretrained models only
