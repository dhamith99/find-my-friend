stages:
  prepare:
    cmd: python -m src.data.make_dataset
    deps:
      - raw
      - src/data/make_dataset.py
      - src/data/face.py
      - assets/face_detection_yunet_2023mar.onnx
    params:
      - data
      - face
    outs:
      - data
      - reports/figures/face_crops.png   # shows faces -> stored by DVC, not Git
    metrics:
      - reports/data_stats.json:          # counts only, safe to keep in Git
          cache: false

  tune:
    foreach: [custom_cnn, mobilenet_v3_small, resnet18]
    do:
      cmd: python -m src.tune --model ${item}
      deps:
        - data
        - src/tune.py
        - src/train.py
        - src/models
        - src/data/dataset.py
      params:
        - seed
        - tune
        - train.num_workers
      metrics:
        - reports/tuning/${item}/best_params.json:
            cache: false
      plots:
        - reports/tuning/${item}/optimization_history.png:
            cache: false
        - reports/tuning/${item}/param_importances.png:
            cache: false
